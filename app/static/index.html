<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Студия сериала</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/themes.css">
<script>
  // тема ставится до отрисовки, чтобы страница не мигала (выбор хранится в этом браузере; по умолчанию светлая)
  document.documentElement.classList.add("grafit");
  document.documentElement.dataset.theme = "light";
  try { if (localStorage.getItem("theme") === "dark") document.documentElement.dataset.theme = "dark"; } catch {}
</script>
</head>
<body>
<aside class="nav" id="nav" hidden></aside>
<div class="page"><main id="view"></main><footer class="site-foot" id="foot"></footer></div>
<button id="to-top" class="to-top" type="button" aria-label="Наверх" title="Наверх"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg></button>
<div id="toast"></div>
<dialog id="modal"><div id="modal-body"></div></dialog>
<script type="module" src="/static/js/main.js"></script>
</body>
</html>
